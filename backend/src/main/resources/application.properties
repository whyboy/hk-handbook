spring.application.name=hk-handbook
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./hk-handbook.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.sql.init.mode=never
# Local editorial preview only; keep disabled in production.
handbook.preview-enabled=${HANDBOOK_PREVIEW_ENABLED:false}
